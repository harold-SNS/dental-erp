name: Finalize Neon lockfile

on:
  push:
    branches: [fix/neon-lockfile-ci]
    paths:
      - package.json
      - .github/workflows/finalize-neon-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Generate synchronized lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile for Neon PostgreSQL"
          git pull --rebase origin fix/neon-lockfile-ci
          git push origin HEAD:fix/neon-lockfile-ci
