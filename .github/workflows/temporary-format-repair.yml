name: Temporary format repair
on:
  push:
    branches: [fix/neon-lockfile-ci]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/deployment/deployment-config.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/deployment/deployment-config.test.ts
          git commit -m "style: apply Prettier to deployment config tests"
          git push origin HEAD:${GITHUB_REF_NAME}
